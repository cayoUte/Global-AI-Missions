# Global AI Missions — local stack (delivery-engineer).
#
#   cp .env.example .env
#   docker compose up -d --build       # PostgreSQL + the app on http://localhost:8000
#   docker compose up -d --wait db     # only PostgreSQL (development without the app container)
#   docker compose down                # stop (data kept in the gam_pgdata volume)
#   docker compose down -v             # stop and wipe the database
#
# The database is published on host port 5433 (not 5432) so it never clashes with a
# PostgreSQL already installed on the machine. Override with POSTGRES_HOST_PORT in .env.
# Credentials are dev-only and match DATABASE_URL in .env.example.
#
# `api` is the production image (Dockerfile): FastAPI serves the API and the built SPA on one
# origin; on start it runs the migrations and the idempotent seed (docker/entrypoint.sh).

name: global-ai-missions

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: gam
      POSTGRES_PASSWORD: gam
      POSTGRES_DB: gam
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - gam_pgdata:/var/lib/postgresql/data
      # Runs once, on the first start of an empty volume: creates the gam_test database.
      - ./docker/db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gam -d gam"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

  api:
    build: .
    image: global-ai-missions-api:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    # Everything else (JWT_SECRET, COACH_PROVIDER, the optional provider keys, DEMO_MODE,
    # COOKIE_SECURE...) comes from .env; the values below win over it.
    env_file: .env
    environment:
      # The compose network, not the host port 5433 used by development tools.
      DATABASE_URL: postgresql+psycopg://gam:gam@db:5432/gam
      PORT: "8000"
    ports:
      - "${API_HOST_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  gam_pgdata:
