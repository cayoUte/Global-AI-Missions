# Global AI Missions — Render Blueprint (delivery-engineer). Free plan only.
# Render dashboard → New → Blueprint → pick this repository → Apply. See README "Deploy en Render".
#
# One Docker web service built from ./Dockerfile (the same image as `docker compose`) and one
# managed PostgreSQL. On every start the entrypoint rewrites Render's postgresql:// URL to
# postgresql+psycopg://, runs the migrations and the idempotent seed, then starts uvicorn on $PORT.
# Free-plan limits: the web service sleeps after ~15 idle minutes (the first request then takes
# about a minute) and the free database expires 30 days after it is created.

services:
  - type: web
    name: global-ai-missions
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: global-ai-missions-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true # random 256-bit value, generated once by Render
      - key: COOKIE_SECURE
        value: "true" # Render serves HTTPS only
      - key: DEMO_MODE
        value: "true" # the check-in screen lists the demo accounts (evaluation demo)
      # Maya's post-mission feedback through Groq (free tier, OpenAI-compatible API, PD-033).
      # Only the key is secret: Render asks for it when the Blueprint is applied (never commit
      # it). Without a key, or on any Groq error, timeout or rate limit, the app falls back to
      # the deterministic mock, so the demo never breaks. Check the model id against Groq's
      # current model list (console.groq.com) and change it here or in the dashboard.
      - key: COACH_PROVIDER
        value: openai_compatible
      - key: OPENAI_COMPAT_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: OPENAI_COMPAT_MODEL
        value: llama-3.3-70b-versatile
      - key: OPENAI_COMPAT_LABEL
        value: Groq · Llama
      - key: OPENAI_COMPAT_API_KEY
        sync: false
      # Claude instead of Groq: set COACH_PROVIDER=anthropic and these two in the dashboard.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        sync: false

databases:
  - name: global-ai-missions-db
    plan: free
    databaseName: gam
    user: gam
    postgresMajorVersion: "16"
    ipAllowList: [] # reachable only from Render's private network (the web service)
